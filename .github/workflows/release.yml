name: Release

# Push a tag like v0.2.0 (matching app/appinfo.json) to build the .ipk and publish it
# as a GitHub release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check the tag matches the app version
        run: |
          version=$(node -p "require('./app/appinfo.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match version $version in app/appinfo.json"
            exit 1
          fi

      - run: npm test

      - run: npm run package

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.ipk --title "$GITHUB_REF_NAME" --generate-notes

      # Homebrew Channel reads repo.json from the gh-pages branch, which is rebuilt from scratch on every release.
      - name: Publish the Homebrew Channel repo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir site
          node tools/make-repo.js dist/*.ipk "$GITHUB_REF_NAME" site/repo.json
          cp app/icon.png site/
          cd site
          git init -q -b gh-pages
          git add .
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -q -m "Homebrew Channel repo for $GITHUB_REF_NAME"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
