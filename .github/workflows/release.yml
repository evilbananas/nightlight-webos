name: Release

# Push a tag like v0.2.0 (matching app/appinfo.json) to build the .ipk and publish it
# as a GitHub release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check the tag matches the app version
        run: |
          version=$(node -p "require('./app/appinfo.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match version $version in app/appinfo.json"
            exit 1
          fi

      - run: npm test

      - run: npm run package

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.ipk --title "$GITHUB_REF_NAME" --generate-notes
